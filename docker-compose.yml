version: "3.9"

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    env_file: .env
    environment:
      - WA_SERVICE_URL=http://whatsapp:3001
      - WA_SERVICE_SECRET=${WA_SERVICE_SECRET}
    entrypoint: >
      sh -c "pocketbase superuser upsert $${PB_ADMIN_EMAIL} $${PB_ADMIN_PASSWORD} 2>/dev/null || true &&
             pocketbase serve --http=0.0.0.0:8090"
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  whatsapp:
    build: ./whatsapp-service
    restart: unless-stopped
    env_file: .env
    environment:
      - PB_URL=http://pocketbase:8090
    volumes:
      - ./whatsapp-service/auth_info:/app/auth_info
    expose:
      - "3001"
    depends_on:
      pocketbase:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pocketbase
      - frontend
      - whatsapp
